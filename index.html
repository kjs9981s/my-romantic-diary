<script>
const $=id=>document.getElementById(id),KEY='my_emotion_diary';let entries=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');entries=Array.isArray(v)?v:[]}catch(e){alert('기존 일기 데이터를 읽지 못했습니다. 원본을 보존하세요.')}let editingId=null,currentPhoto='',selectedMood='😊 행복',calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),recognition=null,isRecording=false;const moods=['😊 행복','😌 평온','🥳 신남','😴 피곤','😢 슬픔','😡 화남'];const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('entryDate').value=today();document.body.className=(localStorage.getItem('diary_theme')||'theme-cream').replace('theme-','')+' '+(localStorage.getItem('diary_font')||'font-md').replace('font-md','normal').replace('font-sm','small').replace('font-lg','large').replace('font-xl','xlarge');if(localStorage.getItem('diary_pin'))lockNow();function updatePinDots(){let n=$('pinInput').value.length;$('pinDots').textContent=Array.from({length:4},(_,i)=>i<n?'●':'○').join(' ');$('pinDots').setAttribute('aria-label',n+'자리 입력');}function pinDigit(n){let p=$('pinInput');$('pinError').textContent='';if(n==='back')p.value=p.value.slice(0,-1);else if(p.value.length<4)p.value+=n;updatePinDots();if(p.value.length===4){checkPin();updatePinDots();}}function checkPin(){if($('pinInput').value===localStorage.getItem('diary_pin'))unlockDiary();else{$('pinError').textContent='비밀번호가 일치하지 않습니다.';$('pinInput').value=''}}
function paintMoods(){$('moodPicker').innerHTML='';moods.forEach(m=>{const b=document.createElement('button');b.textContent=m;b.className=m===selectedMood?'active':'';b.onclick=()=>{selectedMood=m;paintMoods()};$('moodPicker').appendChild(b)})}paintMoods();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function store(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch(e){alert('저장 공간이 부족하거나 저장할 수 없습니다. 사진 크기를 줄이거나 백업을 확인하세요.');return false}}function handlePhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,800/im.width);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);currentPhoto=c.toDataURL('image/jpeg',.75);$('photoPreview').src=currentPhoto;$('photoPreviewWrap').classList.remove('hidden')};im.src=ev.target.result};r.readAsDataURL(f)}function removePhoto(){currentPhoto='';$('photoInput').value='';$('photoPreviewWrap').classList.add('hidden')}
